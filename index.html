<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nana</title>

    <link rel="stylesheet" href="css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="home">
      <div class="image-container">
        <div class="home-rectangles">
          <div class="home-rectangle rectangle-1"></div>
          <div class="home-rectangle rectangle-2"></div>
          <div class="home-rectangle rectangle-3"></div>
          <div class="home-rectangle rectangle-4"></div>
          <div class="home-rectangle rectangle-5"></div>
          <div class="home-rectangle rectangle-6"></div>
        </div>

        <!-- Transparent navigation layer -->
        <div class="home-nav-overlay">
          <a
            href="/nanana/travel-books/"
            class="home-nav-square rectangle-3-nav"
            aria-label="Travel Books"
          >
            <span class="speech-bubble"> travel books </span>
          </a>

          <a
            href="/nanana/contact/"
            class="home-nav-square rectangle-5-nav"
            aria-label="Contact"
          >
            <span class="speech-bubble"> contact </span>
          </a>
        </div>

        <img src="images/home-image.png" alt="Home" class="home-image" />
      </div>
    </main>

    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
