<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calendar — nana</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="calendar-page">
    <main class="calendar-main">
      <section aria-label="Monthly calendar">
        <div class="month-row">
          <button class="month-btn" id="prev-month" aria-label="Previous month">
            ‹
          </button>
          <h2 id="month-label"></h2>
          <button class="month-btn" id="next-month" aria-label="Next month">
            ›
          </button>
        </div>

        <div class="calendar-wrap">
          <div class="calendar">
            <div class="weekdays" aria-hidden="true">
              <div class="weekday">SUN</div>
              <div class="weekday">MON</div>
              <div class="weekday">TUE</div>
              <div class="weekday">WED</div>
              <div class="weekday">THU</div>
              <div class="weekday">FRI</div>
              <div class="weekday">SAT</div>
            </div>

            <div class="days" id="calendar-days"></div>
          </div>
        </div>
      </section>
    </main>

    <div
      class="memory-overlay"
      id="memory-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memory-title"
      aria-hidden="true"
    >
      <section class="memory-panel">
        <button
          class="close-memory"
          id="close-memory"
          aria-label="Close memory"
        >
          ×
        </button>
        <p class="memory-date" id="memory-date"></p>
        <h2 class="memory-title" id="memory-title"></h2>
        <p class="memory-text" id="memory-text"></p>
        <div class="photo-deck" id="photo-deck"></div>
      </section>
    </div>
    <script src="../js/calendar.js"></script>
    <script src="../js/header.js"></script>
  </body>
</html>
